name: Release

# 打 tag(v* )即自动发布;也可在 Actions 页手动触发(填 tag)。
# asm.js 是交叉编译器:一台 Linux runner 用 Node 就能产出全部 5 个目标的原生 CLI。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.15)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual dispatch must build the named tag, not the branch tip.
          # Tag pushes already check out the tagged commit via GITHUB_REF.
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify tag matches checkout
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null || true)"
          echo "HEAD=${HEAD_SHA} tag=${TAG_SHA:-missing}"
          if [ -z "${TAG_SHA}" ]; then
            echo "ERROR: tag ${TAG} does not exist" >&2
            exit 1
          fi
          if [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "ERROR: checkout commit ${HEAD_SHA} != tag ${TAG} commit ${TAG_SHA}" >&2
            exit 1
          fi
          echo "OK: building tag ${TAG} at ${HEAD_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Fast contracts (blocking)
        run: npm test

      - name: Platform ABI contracts (blocking)
        run: npm run platform:contract

      - name: Cross-compile asm.js CLI for all 5 targets
        run: |
          set -euo pipefail
          mkdir -p dist
          for T in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            echo "::group::build $T"
            node cli.js cli.js -o "dist/asm.js-$T" --target "$T"
            echo "::endgroup::"
          done
          ls -la dist

      - name: Smoke test (linux-x64 runs natively on the x64 runner)
        # Blocking: a broken linux-x64 product must not ship.
        # If overcommit/mmap of the large initial heap is refused on this
        # runner, fail loudly — do not release a binary that cannot run.
        run: |
          set -euo pipefail
          printf 'console.log("asm.js-ci-ok", 6*7);' > hello.js
          ./dist/asm.js-linux-x64 hello.js -o hello --target linux-x64
          out="$(./hello)"
          echo "output: $out"
          test "$out" = "asm.js-ci-ok 42"

      - name: Generate build metadata
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "tag=${TAG}"
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "targets=macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum asm.js-* BUILD_INFO.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --title "asm.js $TAG" \
            --notes "Self-hosting asm.js CLI, cross-compiled from tag ${TAG} (commit $(git rev-parse --short HEAD)) for all five targets (macOS-ARM64, macOS-x64, Linux-ARM64, Linux-x64, Windows-x64). Each binary compiles \`cli.js\` into a native executable — no Node.js and no third-party dependencies at runtime. Verify integrity with \`SHA256SUMS.txt\`; see \`BUILD_INFO.txt\` for the exact commit and toolchain. Technical preview — not a stable toolchain. See the README's Self-Hosting section for the \`gen2 == gen3\` fixed-point results."
