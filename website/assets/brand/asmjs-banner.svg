<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="asm.js Official Social Preview Banner">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap');
    .banner-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: 78px;
      letter-spacing: -3px;
      fill: #F1EEE4;
    }
    .banner-dot {
      fill: #B7F34A;
    }
    .banner-slogan {
      font-family: 'Inter', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -1px;
      fill: #F1EEE4;
    }
    .banner-sub {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #8D938E;
    }
    .mono-meta {
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>

  <defs>
    <radialGradient id="bannerGlow" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="25%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#B7F34A" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#B7F34A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bannerGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2B2F2C" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <filter id="fixedGlowBig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#B7F34A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#0B0D0C"/>
  <rect width="1200" height="630" fill="url(#bannerGrid)"/>
  <rect width="1200" height="630" fill="url(#bannerGlow)"/>
  <rect width="1200" height="630" fill="url(#greenGlow)"/>

  <!-- Outer Precision Frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#2B2F2C" stroke-width="1"/>
  
  <!-- Technical Grid Crosshairs -->
  <path d="M 20 24 H 28 M 24 20 V 28 M 1172 24 H 1180 M 1176 20 V 28 M 20 606 H 28 M 24 602 V 610 M 1172 606 H 1180 M 1176 602 V 610" stroke="#FF5A1F" stroke-width="1"/>

  <!-- Top Metadata Line -->
  <text x="56" y="68" fill="#8D938E" class="mono-meta" font-size="13" letter-spacing="2">AOT COMPILER · ZERO DEPENDENCIES · THE QUANTUM GATEWAY</text>
  <text x="1060" y="68" fill="#B7F34A" class="mono-meta" font-size="13" letter-spacing="1">● PRE-PRODUCTION</text>

  <!-- Background Watermark -->
  <g transform="translate(700, 80) scale(5.8)" opacity="0.08">
    <path fill="#FF5A1F" d="M34 8 H18 C13 8 10 11 10 16 V28 C10 32 8 34 4 34 V42 C8 42 10 44 10 48 V60 C10 65 13 68 18 68 H34 V56 H22 C20 56 20 54 20 50 V43 C20 38 16 36 12 35 C16 34 20 32 20 27 V20 C20 16 20 20 22 20 H34 V8 Z" />
    <rect x="40" y="18" width="8" height="40" rx="1" fill="#FF5A1F" />
    <rect x="54" y="18" width="16" height="16" rx="1" fill="#FF5A1F" />
    <rect x="54" y="42" width="16" height="16" rx="1" fill="#B7F34A" />
  </g>

  <!-- Left Main Content Group -->
  <g transform="translate(56, 145)">
    <!-- Main Combination Logo -->
    <g transform="translate(0, 0)">
      <!-- Mark -->
      <g transform="translate(0, 0) scale(1.35)">
        <path fill="#FF5A1F" d="M30 8 H16 C12 8 9 11 9 15 V24 C9 27 7 29 4 29 V35 C7 35 9 37 9 40 V49 C9 53 12 56 16 56 H30 V46 H20 C18 46 18 45 18 42 V36 C18 32 15 30 11 29 C15 28 18 26 18 22 V16 C18 13 18 16 20 16 H30 V8 Z" />
        <rect x="35" y="15" width="7" height="34" rx="1" fill="#FF5A1F" opacity="0.65" />
        <rect x="47" y="15" width="14" height="14" rx="1" fill="#FF5A1F" opacity="0.4" />
        <rect x="47" y="35" width="14" height="14" rx="1" fill="#B7F34A" filter="url(#fixedGlowBig)" />
      </g>
      <!-- Wordmark -->
      <text x="110" y="65" class="banner-title">asm<tspan class="banner-dot">.</tspan>js</text>
    </g>

    <!-- Slogan -->
    <text x="0" y="205" class="banner-slogan">
      把 JavaScript，<tspan fill="#FF5A1F">铸成</tspan> 原生二进制。
    </text>
    <text x="0" y="252" class="banner-sub">
      JavaScript. Forged native. Direct AOT compilation to standalone Mach-O, ELF &amp; PE binaries.
    </text>

    <!-- Bottom Badges / Metrics -->
    <g transform="translate(0, 305)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="180" height="52" fill="#141816" stroke="#2B2F2C" stroke-width="1"/>
      <text x="18" y="22" fill="#8D938E" class="mono-meta" font-size="10">SELF-HOSTING</text>
      <text x="18" y="42" fill="#B7F34A" class="mono-meta" font-size="14" font-weight="600">gen2 ≡ gen3</text>

      <!-- Box 2 -->
      <rect x="195" y="0" width="180" height="52" fill="#141816" stroke="#2B2F2C" stroke-width="1"/>
      <text x="213" y="22" fill="#8D938E" class="mono-meta" font-size="10">TARGETS</text>
      <text x="213" y="42" fill="#F1EEE4" class="mono-meta" font-size="14" font-weight="600">macOS · Linux · Win</text>

      <!-- Box 3 -->
      <rect x="390" y="0" width="195" height="52" fill="#141816" stroke="#2B2F2C" stroke-width="1"/>
      <text x="408" y="22" fill="#8D938E" class="mono-meta" font-size="10">DEPENDENCY</text>
      <text x="408" y="42" fill="#FF5A1F" class="mono-meta" font-size="14" font-weight="600">ZERO (0 THIRD-PARTY)</text>
    </g>
  </g>

  <!-- Footer Link -->
  <text x="56" y="580" fill="#8D938E" class="mono-meta" font-size="13">asm.js.cn  ·  github.com/qorm/asm.js</text>
</svg>
