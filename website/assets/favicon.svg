<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="asm.js Favicon">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#080A09"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#B7F34A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Silicon Shield -->
  <rect width="64" height="64" rx="12" fill="url(#favBg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none" stroke="#2B2F2C" stroke-width="1"/>

  <!-- Centered Quantum Gateway Mark (Fitted for 64px) -->
  <g transform="translate(1, 0)">
    <!-- Syntax Bracket -->
    <path fill="#FF5A1F" d="M27 12 H14 C10 12 8 14 8 18 V26 C8 29 6 30 3 30 V34 C6 34 8 35 8 38 V46 C8 50 10 52 14 52 H27 V43 H17 C16 43 16 42 16 39 V34 C16 30 13 28 10 27 C13 26 16 24 16 20 V15 C16 12 16 15 17 15 H27 V12 Z" />
    <!-- Tunnel -->
    <rect x="31" y="20" width="6" height="24" rx="1" fill="#FF5A1F" opacity="0.65" />
    <!-- Machine Bits -->
    <rect x="41" y="20" width="12" height="10" rx="1" fill="#FF5A1F" opacity="0.4" />
    <rect x="41" y="34" width="12" height="10" rx="1" fill="#B7F34A" filter="url(#favGlow)" />
  </g>
</svg>
